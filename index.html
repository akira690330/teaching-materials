<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動教材</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.list{max-width:1380px;margin:0 auto;padding:12px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;color:var(--ink);text-decoration:none}
.item:hover{border-color:#bfb6a3}
.item h2{font-size:18px;margin:4px 0}
.item p{margin:0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="kicker">互動教材</div>
  <h1>課程動畫與互動教材</h1>
  <p class="sub">點選單元開啟；建議使用電腦瀏覽器。</p>
</header>
<main class="list">
  <a class="item" href="physics/mechanics/flying-roadster/">
    <div class="kicker">高中物理．力學應用</div>
    <h2>Roadster「飛天車」：一趟展示裡的力學</h2>
    <p>受力分析、圓周運動、拋體、力偶與角動量、衝量，共 14 個關鍵點。</p>
  </a>
</main>
</body>
</html>
